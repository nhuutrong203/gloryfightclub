# Pushes to main check the code, apply pending D1 migrations, and deploy to Cloudflare.
# Requires the CLOUDFLARE_API_TOKEN repository secret. See Auto deploy in the README.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Run manually from the GitHub Actions tab.

# Run one production deployment at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret. See Auto deploy in the README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check destination database is configured
        run: |
          if grep -q 'abdfce93-2cee-4e7a-8388-ee3850d794bc' wrangler.jsonc; then
            echo "::error::Destination D1 database ID is missing. Create and migrate glory-db in the club account before deploying."
            exit 1
          fi

      - name: Check TypeScript
        run: |
          npx wrangler types   # Generate worker-configuration.d.ts locally.
          npx astro check

      - name: Test
        run: npm test

      - name: Test API on disposable local D1
        run: npm run test:api

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply glory-db --remote

      - name: Build + deploy
        run: npm run deploy
